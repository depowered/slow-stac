[package]
name = "slow-stac-reorg"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.82"
aws-config = { version = "1.5.6", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.51.0"
aws-smithy-types = "1.2.6"
clap = { version = "4.5.18", features = ["derive"] }
derive_more = {version = "1.0.0", features = ["default", "from", "from_str"]}
reqwest = "0.12.7"
serde = "1.0.210"
serde_json = "1.0.128"
stac = {version =  "0.10.1", features = ["reqwest"]}
tokio = {version = "1.40.0", features = ["full"]}
toml = "0.8.19"
